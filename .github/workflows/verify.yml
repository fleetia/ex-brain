name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check release artifacts
        run: bash tests/check-release.sh

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check native Windows installer and hooks
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\windows-installer.ps1
