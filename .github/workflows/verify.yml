name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check release artifacts
        run: bash tests/check-release.sh

  macos-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ensure jq is available
        shell: /bin/bash {0}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            brew install jq
          fi

      - name: Check native macOS installer and hooks
        shell: /bin/bash {0}
        run: /bin/bash tests/check-release.sh

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check native Windows installer and hooks
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\windows-installer.ps1

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release-checks, macos-native, windows-native]
    runs-on: ubuntu-latest
    concurrency: ${{ github.workflow }}-${{ github.ref }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 쌓인 changeset이 있으면 "버전 릴리스 준비" PR을 생성/갱신하고 여기서 끝.
      # 그 PR을 머지하면 changeset이 비워진 상태로 이 워크플로우가 다시 돌아 아래 릴리스 단계가 실행된다.
      - name: Changesets
        id: changesets
        uses: changesets/action@v1
        with:
          version: npx changeset version
          commit: 'chore: 버전 릴리스 준비'
          title: 'chore: 버전 릴리스 준비'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"

          if [ "$VERSION" = "0.0.0" ]; then
            echo "아직 버전이 발행되지 않았습니다 — 스킵"
            exit 0
          fi
          CLI_ASSET="ai-session-kit-cli-$TAG.zip"
          APP_ASSET="ai-session-kit-app-$TAG.zip"
          if RELEASE_JSON="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets 2>/dev/null)"; then
            TAG_COMMIT="$(git rev-parse --verify "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
            if [ -z "$TAG_COMMIT" ]; then
              echo "release $TAG는 있지만 checkout에서 대응 tag commit을 확인할 수 없습니다."
              exit 1
            fi
            if printf '%s' "$RELEASE_JSON" | jq -e \
              --arg tagCommit "$TAG_COMMIT" \
              --arg cli "$CLI_ASSET" \
              --arg app "$APP_ASSET" '
                .isDraft == false and
                .targetCommitish == $tagCommit and
                any(.assets[]; .name == $cli and .size > 0) and
                any(.assets[]; .name == $app and .size > 0)
              ' >/dev/null; then
              echo "release $TAG가 tag commit과 두 asset을 모두 포함함 — 스킵"
              exit 0
            fi
            echo "release $TAG가 draft·commit·asset 검증을 통과하지 못했습니다. 자동으로 덮어쓰지 않습니다."
            exit 1
          fi

          EXISTING_TAG_COMMIT="$(git rev-parse --verify "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
          if [ -n "$EXISTING_TAG_COMMIT" ] && [ "$EXISTING_TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "release 없는 기존 tag $TAG가 현재 artifact commit과 다릅니다: $EXISTING_TAG_COMMIT"
            exit 1
          fi

          bash build.sh dist
          (cd dist && zip -rq "ai-session-kit-cli-$TAG.zip" cli && zip -rq "ai-session-kit-app-$TAG.zip" app)

          # CHANGELOG.md에서 이번 버전 섹션만 추출해 릴리스 노트로 사용
          awk -v ver="$VERSION" '$0 == "## " ver {flag=1; next} /^## / && flag {exit} flag {print}' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "릴리스 $TAG" > dist/notes.md

          gh release create "$TAG" \
            "dist/$CLI_ASSET" \
            "dist/$APP_ASSET" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file dist/notes.md
